<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="vera: terminal demo — asking for a command in plain English and running it">
  <title>vera: terminal demo — asking for a command in plain English and running it</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b0820" flood-opacity="0.45"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 17px; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .cur { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="880" height="400" rx="22" fill="url(#bg)"/>
  <circle cx="790" cy="60" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="90" cy="380" r="140" fill="#ffffff" opacity="0.05"/>

  <text x="56" y="78" class="sans" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">vera</text>
  <text x="168" y="77" class="sans" font-size="19" fill="#e0e7ff">your terminal, in plain words · 100% local AI</text>

  <g filter="url(#shadow)">
    <rect x="56" y="110" width="768" height="250" rx="14" fill="#11111b"/>
    <rect x="56" y="110" width="768" height="38" rx="14" fill="#1e1e2e"/>
    <rect x="56" y="134" width="768" height="14" fill="#1e1e2e"/>
    <circle cx="82" cy="129" r="6.5" fill="#f38ba8"/>
    <circle cx="104" cy="129" r="6.5" fill="#f9e2af"/>
    <circle cx="126" cy="129" r="6.5" fill="#a6e3a1"/>
    <text x="440" y="134" class="sans" font-size="13" fill="#9399b2" text-anchor="middle">~/projects — zsh</text>
  </g>

  <g class="mono">
    <text x="84" y="188"><tspan fill="#a6e3a1">$</tspan><tspan fill="#cdd6f4"> vera </tspan><tspan fill="#f9e2af">what process is using port 3000</tspan></text>
    <text x="84" y="226"><tspan fill="#cba6f7" font-weight="700">❯ </tspan><tspan fill="#ffffff" font-weight="700">lsof -i :3000</tspan></text>
    <text x="84" y="254" fill="#9399b2">  Shows which processes are using port 3000.</text>
    <text x="84" y="292"><tspan fill="#cdd6f4">¿Ejecutar? [s/N/c=copiar] </tspan><tspan fill="#a6e3a1">s</tspan></text>
    <text x="84" y="330"><tspan fill="#a6e3a1">✓ </tspan><tspan fill="#cdd6f4">terminado</tspan><tspan class="cur" fill="#cdd6f4"> ▋</tspan></text>
  </g>
</svg>
