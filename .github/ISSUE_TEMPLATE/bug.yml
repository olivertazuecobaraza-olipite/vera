name: Fallo
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. Si es una vulnerabilidad de seguridad, **no** la publiques aquí: sigue SECURITY.md.
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Qué hiciste, qué esperabas y qué ocurrió.
      placeholder: "Ejecuté «vera …» y …"
    validations:
      required: true
  - type: textarea
    id: salida
    attributes:
      label: Comando y salida
      description: El comando exacto y lo que mostró vera (puedes quitar datos privados).
      render: shell
  - type: input
    id: version
    attributes:
      label: Versión de vera
      description: Salida de `vera --version`
    validations:
      required: true
  - type: dropdown
    id: so
    attributes:
      label: Sistema operativo
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: input
    id: detalles
    attributes:
      label: Shell, modelo y versión de Ollama
      placeholder: "zsh · qwen3.5:9b · ollama 0.32.5"
