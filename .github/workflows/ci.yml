# Verificaciones de cada PR y de cada push a develop y main.
# Los nombres de los jobs son los «checks» obligatorios de las reglas de las ramas.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Formato (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Archivos sin formatear (ejecuta gofmt -w .):"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy sin cambios
        run: go mod tidy -diff
      - name: go vet (macOS, Linux y Windows)
        run: |
          for os in darwin linux windows; do
            echo "== $os"; GOOS=$os go vet ./...
          done
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: actionlint (sintaxis de los workflows)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: zizmor (seguridad de los workflows)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.32.0"
          advanced-security: false
          persona: regular

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Tests (con detector de carreras en Linux y macOS)
        shell: bash
        run: |
          race=""
          if [ "$RUNNER_OS" != "Windows" ]; then race="-race"; fi
          go test $race -coverprofile=cover.out ./...
      - name: Cobertura
        shell: bash
        run: go tool cover -func=cover.out | tail -1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-${{ matrix.os }}
          path: cover.out
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false # compila lo mismo que se publica: sin caché (evita envenenamiento)
      - name: Compilar los 6 binarios (darwin, linux, windows × amd64, arm64)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Vulnerabilidades conocidas en dependencias y biblioteca estándar
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  # Prueba de extremo a extremo antes de publicar: solo en las PR de develop a main.
  e2e:
    name: e2e
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MODEL: qwen3:0.6b
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Compilar vera
        run: go build -o vera ./cmd/vera
      - name: vera ollama (instala Ollama y descarga el modelo, como un usuario nuevo)
        run: printf 's\n' | ./vera ollama "$MODEL"
      - name: Tests de integración con Ollama real
        run: VERA_TEST_MODEL="$MODEL" go test -tags=integration -v -count=1 ./...
      - name: Petición real
        run: |
          out=$(echo n | ./vera listar los archivos de esta carpeta)
          echo "$out"
          echo "$out" | grep -q "❯" || { echo "vera no propuso ningún comando"; exit 1; }
