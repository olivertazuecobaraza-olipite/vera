# Actualizaciones automáticas de dependencias. Las PR van a develop y pasan por el CI como cualquier otra.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7 # no proponer versiones con menos de 7 días (ataques a la cadena de suministro)
    commit-message:
      prefix: "build(deps)" # título convencional: lo exige el check pr-title
    groups:
      go:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
